knpu_oauth2_client:
    clients:
        google_staff:
            type: google
            client_id: '%env(resolve:GOOGLE_CLIENT_ID)%'
            client_secret: '%env(resolve:GOOGLE_CLIENT_SECRET)%'
            redirect_route: connect_google_check
            redirect_params: {}
        google_customer:
            type: google
            client_id: '%env(resolve:GOOGLE_CLIENT_ID)%'
            client_secret: '%env(resolve:GOOGLE_CLIENT_SECRET)%'
            # Same callback as staff — avoids redirect_uri_mismatch in Google Cloud Console
            redirect_route: connect_google_check
            redirect_params: {}